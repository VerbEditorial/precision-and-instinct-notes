<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Precision and Instinct — Source Lists</title>
<meta http-equiv="refresh" content="0; url=episodes/">
<link rel="canonical" href="episodes/">
<style>
:root {
  --bg: #14171a;
  --text: #f2efe9;
  --accent: #ec3013;
  --muted-70: rgba(242,239,233,0.70);
}
* { box-sizing: border-box; }
body {
  margin: 0;
  min-height: 100vh;
  display: flex;
  align-items: center;
  justify-content: center;
  background: var(--bg);
  color: var(--text);
  font-family: system-ui, sans-serif;
  text-align: center;
  padding: 24px;
}
a { color: var(--accent); text-decoration: underline; }
p { color: var(--muted-70); }
</style>
</head>
<body>
<div>
  <p>Redirecting to the episode source lists&hellip;</p>
  <p><a href="episodes/">Continue to episodes &rarr;</a></p>
</div>
<script>location.replace("episodes/");</script>
</body>
</html>
